[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invisible_core"
# Derived from the seal (see src/invisible_core/_version.py): the tag number of
# the engine this core is sealed to, so a binary bump always moves the version
# string pip compares before it decides whether to reinstall. A core-only fix
# against the same engine moves CORE_REVISION instead, by hand - and
# scripts/version_gate.py refuses to publish content that changed under a
# version string that did not.
dynamic = ["version"]
description = "Pure config for a stealth Firefox profile: seed -> fingerprint -> prefs, engine download, proxy, geo. Zero Playwright."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "feder-cr", email = "85809106+feder-cr@users.noreply.github.com" }]
keywords = [
    "firefox",
    "stealth",
    "anti-detect",
    "fingerprint",
    "browser",
    "automation",
    "privacy",
]
# No `License :: OSI Approved :: MIT License` classifier: PEP 639 says the
# License-Expression field above is the declaration, and a build tool must not
# add the classifier beside it.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
# No direct URL (`name @ git+https://...`) may appear here. A public index
# rejects an upload whose Requires-Dist carries one, and a direct reference
# carries no version specifier, so `pip check` has nothing to compare and
# reports a definitively broken environment as healthy.
dependencies = [
    "platformdirs>=4",
    # Process identity and the OS-level lifetime guard (invisible_core/process.py).
    # Both consumers already declared it, so nobody gains a dependency: what
    # changes is that they stop each carrying their own copy of the same code -
    # and the manager, which had none, stops leaking its whole browser tree
    # every time it is killed (measured at 8 survivors, 3 runs of 3).
    "psutil>=5.9",
    "requests[socks]>=2.31",
    "maxminddb>=2.2",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-mock>=3", "responses>=0.24", "build>=1", "ruff>=0.6"]

[project.scripts]
invisible-core = "invisible_core.__main__:main"

[project.urls]
Homepage = "https://github.com/feder-cr/invisible_core"
Repository = "https://github.com/feder-cr/invisible_core"
Issues = "https://github.com/feder-cr/invisible_core/issues"

[tool.pytest.ini_options]
markers = [
    # ONE VOCABULARY FOR ALL THREE REPOSITORIES. Aligned 2026-07-27; before
    # that the same word meant different things and selected different sets.
    #
    #   `integration` was "multi-module tests, no browser" in invisible_core and
    #   invisible_playwright, and "launches the real patched Firefox binary" in
    #   invisible_firefox - which is what `e2e` means. So the manager excluded
    #   `integration` by default while the other two ran it, and CLAUDE.md's
    #   "integration is reserved for explicit release runs" was true in one repo
    #   and wrong in the other two, where it names 57 structural tests that must
    #   run on every push.
    #
    #   invisible_core's addopts said `not slow` while never declaring `slow`,
    #   so the exclusion matched nothing and the word meant nothing.
    #
    # The blocks are byte-identical on purpose, and
    # invisible_core/tests/test_marker_vocabulary.py fails when they drift.
    "unit: pure logic - no I/O, no network, no subprocess, no browser",
    "integration: several modules together, in process - no network, no browser",
    "e2e: needs something outside this process - the network, the real patched binary, or a display",
    "slow: builds a wheel or an sdist - opt-in only",
    "linux_only: requires Linux",
]
# Both exclusions in ONE addopts: declaring the key twice is a TOML error, not
# a merge, and pytest then sees neither value.
#
# `integration` is NOT excluded. It is in-process and fast, it is what covers
# the release wiring, and it is the selection a push most needs.
addopts = "-m 'not slow and not e2e' --strict-markers"

[tool.hatch.version]
source = "code"
path = "src/invisible_core/_version.py"
expression = "__version__"

[tool.hatch.build.targets.wheel]
packages = ["src/invisible_core"]
exclude = ["*.bak", "*-bak"]

# PUBLISHED.json and scripts/ are deliberately absent from both targets. The
# ledger records a digest of what ships, so it must never be part of what ships:
# a self-referential ledger would invalidate its own digest on every release.
[tool.hatch.build.targets.sdist]
include = ["src/invisible_core", "tests", "README.md", "LICENSE", "pyproject.toml"]

# Which pre-push gates this repository wants. `.githooks/pre-push` is a stub;
# the policy is invisible_core.hooks, and this block is the only per-repo part
# of it. Declared rather than defaulted on purpose: the wrong default silently
# skips a gate, and a skipped gate reads exactly like a passed one.
#
# `pin = false` because this IS the package the other two pin. There is nothing
# here to compare against.
#
# `pytest = true` is new as of 2026-07-27. This repo's hook ran no tests at all,
# which is why it is the one that pushed red (56b2af2, fourteen tests red on
# main for two hours) while the two repos that depend on it could not.
#
# `release-` is accepted alongside `v` because this repo's tag history has both.
[tool.invisible.hooks]
pytest = true
pin = false
release_tags = ["v", "release-"]
