[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invisible-core"
version = "0.1.0"
description = "Pure config for a patched Firefox stealth profile: seed -> fingerprint -> prefs, binary download, proxy, geo. Zero Playwright."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "feder-cr", email = "85809106+feder-cr@users.noreply.github.com" }]
keywords = ["firefox", "stealth", "anti-detect", "fingerprint", "browser"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "platformdirs>=4",
    "requests[socks]>=2.31",
    "maxminddb>=2.2",
    "tzdata>=2024.1",
    "tqdm>=4.66",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-mock>=3", "responses>=0.24", "build>=1"]

[tool.pytest.ini_options]
markers = [
    "unit: pure-logic tests, no I/O or external deps",
    "integration: multi-module tests, no browser",
]
addopts = "-m 'not slow'"

[project.urls]
Homepage = "https://github.com/feder-cr/invisible_core"
Issues = "https://github.com/feder-cr/invisible_core/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/invisible_core"]
exclude = ["*.bak", "*-bak"]

[tool.hatch.build.targets.sdist]
include = ["src/invisible_core", "tests", "README.md", "LICENSE", "pyproject.toml"]
