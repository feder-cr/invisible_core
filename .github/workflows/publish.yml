name: publish

# The publish path, and the reason the version gate cannot be skipped.
#
# The credential is not in this file and not in a repository secret: it is the
# `pypi` GitHub Environment's OIDC trust relationship, and only the `upload` job
# names that environment. `upload` declares `needs: gate`, so a red gate means
# the only job that can authenticate never starts. That is the whole design -
# there is no step ordering to get wrong and nothing for an operator to
# remember, because the ordering is a dependency rather than a convention.
#
# The workflow is triggered by pushing a release tag, and .githooks/pre-push
# already refuses to push one whose gate is red. Layers, not alternatives: the
# hook is per-clone and can be missing, this cannot.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      first_release:
        description: "Nothing has ever been published (only true once, ever)"
        type: boolean
        default: false
      repository:
        description: "twine repository alias"
        type: choice
        options: [pypi, testpypi]
        default: pypi

permissions:
  contents: read

jobs:
  # Asked FIRST, and of the index rather than of the ledger or the tree.
  #
  # A tag can legitimately name a version that is already on PyPI: tags
  # backfilled for releases that were published by hand, a tag re-pushed after
  # being moved, a re-run of this workflow. In every one of those cases there is
  # nothing to do and nothing wrong - but the gate downstream cannot tell,
  # because no single commit is BOTH the published content AND the record that
  # it was published: the ledger is committed after the upload. Tag the content
  # commit and the gate says PUBLISH ALLOWED and reaches twine, which fails on a
  # filename the index has already served; tag the ledger commit and the tree
  # has moved, so it refuses as a content change.
  #
  # The index is the only authority that answers this without that ambiguity.
  already-published:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.probe.outputs.present }}
      version: ${{ steps.probe.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: probe
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Loaded as a FILE, never imported as `invisible_core._version`:
            # importing a submodule runs the package first and this job installs
            # no dependencies, so the import form dies on platformdirs. It has
            # never shown here because this branch only runs on
            # workflow_dispatch, which is exactly why it went unnoticed.
            VERSION=$(python -c "import importlib.util as u;s=u.spec_from_file_location('_v','src/invisible_core/_version.py');m=u.module_from_spec(s);s.loader.exec_module(m);print(m.__version__)")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          CODE=$(curl -s -o /dev/null -w '%{http_code}'                  "https://pypi.org/pypi/invisible-core/$VERSION/json")
          case "$CODE" in
            200) echo "present=yes" >> "$GITHUB_OUTPUT"
                 echo "::notice::invisible-core $VERSION is already on the index. Nothing to publish; this is a no-op, not a failure." ;;
            404) echo "present=no"  >> "$GITHUB_OUTPUT"
                 echo "::notice::invisible-core $VERSION is not on the index yet; the gate decides." ;;
            *)   echo "the index answered $CODE for $VERSION, which is neither" >&2
                 echo "present nor absent. Refusing rather than guessing." >&2
                 exit 1 ;;
          esac

  gate:
    needs: already-published
    if: needs.already-published.outputs.present != 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate's memory lives in PUBLISHED.json at the repo root and its
          # history is how a lost ledger gets restored. A shallow checkout that
          # dropped it is one of the failures the gate now exits 4 over instead
          # of quietly calling it release 1.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build hatchling
      - name: the package's own runtime dependencies
        # Both steps below run repo scripts that import invisible_core, and
        # importing the package reaches download.py, which imports
        # platformdirs. Without this the gate dies on ModuleNotFoundError
        # before it can judge anything.
        #
        # It had never been noticed because this job had never RUN: the two
        # publish runs before it show `gate: skipped`, because their version
        # was already on the index and `already-published` short-circuits
        # exactly that case. A workflow that only ever no-ops is green in the
        # same way an unexecuted branch is covered.
        run: python -m pip install -e . --quiet
      - name: the hooks are installed for anyone who clones this
        # The local pre-push layer is only real if .githooks is wired up. CI
        # cannot check somebody else's clone, but it can check that the wiring
        # this repo ships still works, so it cannot rot unnoticed.
        run: python scripts/install_hooks.py --check || python scripts/install_hooks.py
      - name: version gate
        # Exit codes: 0 pass, 1 refused, 2 gate broken, 4 no usable ledger.
        # Only 0 continues, and --verify-index makes the ledger's claim get
        # checked against what the index actually serves.
        run: >
          python scripts/version_gate.py check --verify-index
          ${{ (github.event_name == 'workflow_dispatch' && inputs.first_release) && '--first-release' || '' }}

  upload:
    needs: [already-published, gate]
    if: needs.already-published.outputs.present != 'yes'
    runs-on: ubuntu-latest
    environment: pypi          # the credential lives HERE, behind `needs: gate`
    permissions:
      id-token: write          # trusted publishing, no long-lived token anywhere
      contents: write          # to commit the ledger entry back
      pull-requests: write     # and to open one when protection declines the push
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build hatchling twine
      - run: python -m pip install -e . --quiet   # version_gate imports the package
      - name: gate, upload, record
        # Not `twine upload` directly: `publish` re-runs the gate in-process and
        # returns its exit code without reaching twine on a refusal, and it
        # uploads the artifacts it just digested rather than whatever is sitting
        # in dist/. Belt and braces with `needs: gate` on purpose - this job is
        # the one holding the credential.
        run: >
          python scripts/version_gate.py publish --verify-index
          --repository ${{ (github.event_name == 'workflow_dispatch' && inputs.repository) || 'pypi' }}
          ${{ (github.event_name == 'workflow_dispatch' && inputs.first_release) && '--first-release' || '' }}
      - name: commit the ledger entry
        # `publish` wrote PUBLISHED.json after a successful upload. If that never
        # lands on the branch, the next release sees an empty or stale ledger and
        # the gate has no memory of this one.
        #
        # The direct push to main CANNOT succeed while main requires status
        # checks. Measured 2026-08-05 on all three repos: every publish run ended
        # `upload: failure` with `GH006: Protected branch update failed`, on a
        # release that had already shipped. It is not a misconfiguration - the
        # required contexts are correct and the matrix produces them. It is
        # inherent: a required check cannot have passed on a commit that does not
        # exist yet, and since 2026-08-13 `enforce_admins` is TRUE, so not even a
        # maintainer push has a bypass. So the push is TRIED, and when it is
        # declined the entry goes to a branch and a pull request instead of
        # nowhere. Losing the entry is the expensive outcome: it refuses the NEXT
        # release for a reason that has nothing to do with it.
        #
        # Green when the entry is preserved, red only when it is LOST. That
        # sentence was here before the code did it, and the gap cost four runs.
        #
        # THE FALLBACK HAD NEVER RUN ONCE - repaired 2026-08-14. Two defects, and
        # the first hid the second:
        #
        #   1. `git push -f origin "HEAD:$LEDGER_BRANCH"` cannot work from the
        #      detached HEAD a tag build checks out. The destination branch does
        #      not exist yet and the source is a commit object, so git cannot tell
        #      whether it is being asked for a branch or a tag and refuses:
        #      "The destination you provided is not a full refname". Under
        #      `bash -e` that aborts the step immediately, so the pull request
        #      below was never even attempted and neither `::error::` was ever
        #      printed. That is why no `ledger/*` branch and no pull request has
        #      ever existed on any of the three repos. Reproduced in a throwaway
        #      repo before the fix: `HEAD:ledger/1.0.0` exits 1, the fully
        #      qualified form exits 0 and creates the branch.
        #   2. Creating the pull request needs "Allow GitHub Actions to create and
        #      approve pull requests" ON THE REPOSITORY, which is off here
        #      (`can_approve_pull_request_reviews: false`, all three, measured the
        #      same day). The job's own `pull-requests: write` is necessary and
        #      not sufficient. So the pull request is now BEST EFFORT: once the
        #      branch push lands, the entry is safe and the run does not go red
        #      over a convenience that a repository setting can withdraw.
        run: |
          if git diff --quiet -- PUBLISHED.json; then
            echo "no ledger change to commit"
            exit 0
          fi
          VERSION=$(python -c "import json;print(json.load(open('PUBLISHED.json'))['released'][-1]['version'])")
          git config user.name "feder-cr"
          git config user.email "85809106+feder-cr@users.noreply.github.com"
          git add PUBLISHED.json
          git commit -m "record $VERSION as published"
          BRANCH="${{ github.event.repository.default_branch }}"
          if git push origin "HEAD:refs/heads/$BRANCH"; then
            echo "::notice::ledger entry for $VERSION committed to $BRANCH"
            exit 0
          fi
          echo "the direct push was declined; falling back to a branch and a pull request"
          LEDGER_BRANCH="ledger/$VERSION"
          if ! git push -f origin "HEAD:refs/heads/$LEDGER_BRANCH"; then
            echo "::error::the ledger entry for $VERSION reached NEITHER $BRANCH NOR a branch of its own. It exists only in this run. Back-fill it by hand from the artifacts the index serves, or the next release is refused over a missing entry."
            exit 1
          fi
          echo "::notice::the ledger entry for $VERSION is preserved on branch $LEDGER_BRANCH"
          CODE=$(curl -s -o /tmp/pr.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls" \
            -d "{\"title\":\"record $VERSION as published\",\"head\":\"$LEDGER_BRANCH\",\"base\":\"$BRANCH\",\"body\":\"The upload succeeded and the ledger could not be pushed to $BRANCH directly: branch protection declines this token, which has no bypass. Merging this keeps the next release from being refused over a missing entry.\"}")
          if [ "$CODE" = "201" ] || [ "$CODE" = "422" ]; then
            echo "::error::the ledger for $VERSION is NOT on $BRANCH. Branch $LEDGER_BRANCH carries it and a pull request is open (HTTP $CODE; 422 means one already exists). Merge it before the next release."
          else
            echo "::error::the ledger for $VERSION is NOT on $BRANCH. Branch $LEDGER_BRANCH carries it and the pull request could NOT be created (HTTP $CODE - 403 means the repository forbids Actions from creating pull requests). Open and merge it by hand before the next release."
          fi
          exit 0
      - name: create the release page for this tag
        # Measured 2026-08-11: after pushing three tags, FOUR versions out of four
        # had no release page, and it was a wrapper gate
        # (`test_the_published_version_has_a_github_release`, in
        # `test_release_e2e.py`) that found them AFTER publication. A tag with no
        # release page is not cosmetic here: that gate walks every version on the
        # index, so one omission refuses a later run for a version nobody is
        # releasing that day.
        #
        # Runs only on the tag path - `workflow_dispatch` has no tag to describe.
        # Idempotent on purpose: a re-pushed tag, a re-run, or a page created by
        # hand must all be a no-op rather than a failure, which is the same rule
        # `already-published` follows one job up.
        #
        # The body comes from CHANGELOG.md when the repo keeps one (only the
        # wrapper does) and is generated otherwise. One step, both cases, so
        # every repo that pins this package can carry the same text instead of
        # separate variants that drift (three repos, three variants, when this
        # was written; two since invisible_firefox was deleted 2026-08-18).
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::the release page for $TAG already exists - nothing to do"
            exit 0
          fi
          if [ -f CHANGELOG.md ]; then
            awk -v v="$VERSION" '
              $0 ~ ("^## \\[" v "\\]") { p = 1; next }
              p && /^## \[/ { exit }
              p { print }
            ' CHANGELOG.md > /tmp/notes.md
          else
            : > /tmp/notes.md
          fi
          # A body that is only whitespace reads as a page nobody wrote. Say what
          # is true instead: the version, and where the artifacts actually are.
          #
          # The PyPI name is the repository name with hyphens: the repo is
          # `invisible_core` and the project is `invisible-core`. PyPI redirects
          # the underscore form, so getting this wrong would have produced a link
          # that works and is still wrong to read. And no backticks in the body -
          # they would be command substitution inside a double-quoted shell
          # string, which is how fourteen quoted terms once became empty strings.
          PKG=$(printf '%s' "${{ github.event.repository.name }}" | tr '_' '-')
          if [ -z "$(tr -d '[:space:]' < /tmp/notes.md)" ]; then
            printf '%s\n' \
              "$PKG $VERSION is on PyPI." \
              "" \
              "Artifacts and checksums: https://pypi.org/project/$PKG/$VERSION/" \
              > /tmp/notes.md
          fi
          if gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md; then
            echo "::notice::release page created for $TAG"
            exit 0
          fi
          echo "::error::the release page for $TAG could not be created. The package IS published; create the page by hand or a later run of the wrapper's release gate will refuse over it."
          exit 1
