name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both, deliberately. The release ledger is checked in and travels
        # between a Windows checkout with autocrlf and a Linux one, and the
        # first version of the publish gate refused a release on Linux over
        # line endings alone. That regression is only visible on two runners.
        os: [ubuntu-latest, windows-latest]
        # Every version `requires-python = ">=3.11"` promises. Only 3.12
        # ran until 2026-08-01, so three quarters of the floor was a claim
        # nothing checked. test_marker_vocabulary.py compares the two.
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: arm the pre-push publish gate
        # A fresh clone has no core.hooksPath, and tests/test_release_wiring.py
        # says so. Do here what a developer does once.
        run: python scripts/install_hooks.py

      - name: undefined names and duplicate definitions
        # F821 (undefined name) and F811 (redefinition) only. Not a style pass:
        # these two are the rules that catch a name that cannot resolve, which
        # `from __future__ import annotations` hides in an annotation and which
        # a suite only finds if it happens to execute that line. Both bit on
        # 2026-07-28 - a `throwaway_venv` used and imported nowhere took a
        # user-install job red at RUNTIME, and six annotations named a type that
        # was defined in no module at all.
        #
        # Zero violations in all three repos when this was added, so it is a
        # gate rather than a cleanup backlog. Keep it that way.
        run: |
          python -m ruff check --select F821,F811,F601 --no-cache --output-format concise .
      # -rs prints WHY anything skipped, so a skip is readable in the log
      # instead of being indistinguishable from a pass.
      - name: Run the suite
        shell: bash
        run: |
          set -o pipefail   # or tee would swallow pytest's exit code
          python -m pytest -q -rs | tee ci-report.txt

      # A suite that deselected itself into a green tick is what this step
      # exists to prevent, and pytest's exit code cannot distinguish it from a
      # pass. Every consumer has had this guard since 2026-07-25 (both of them
      # then - invisible_playwright and invisible_firefox, the latter deleted
      # 2026-08-18); THIS repo, the one they pin, was the only one without it -
      # the same asymmetry that left it as the only repo whose pre-push hook
      # ran no tests at all.
      #
      # A FLOOR, not a target. The suite is ~805 after 322 tests moved in from
      # the wrapper on 2026-07-27; 600 is far enough below to survive a
      # legitimate removal and far enough above to catch a collapsed selection.
      - name: Refuse a run in which nothing actually ran
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, re, sys
          text = pathlib.Path("ci-report.txt").read_text(encoding="utf-8", errors="ignore")
          m = re.search(r"(\d+) passed", text)
          passed = int(m.group(1)) if m else 0
          if passed < 600:
              print(f"only {passed} test(s) ran (expected at least 600) - the "
                    f"selection deselected the suite", file=sys.stderr)
              sys.exit(1)
          print(f"{passed} tests ran")
          PY

  # ONE CONTEXT FOR THE BRANCH PROTECTION, and that is the reason this job
  # exists. The protection used to list `tests (windows-latest)` and
  # `tests (ubuntu-latest)`: real names when the matrix had only the operating
  # system axis, and never emitted again once it gained the Python version axis.
  # Measured 2026-08-13 on commit c5d7179 - GitHub received eight
  # `tests (<os>, <ver>)` contexts and waited for two no job produces any more.
  # Every push printed "2 of 2 required status checks are expected" and went
  # through regardless, because enforce_admins was false: a decorative
  # protection. It is the same shape as the defect this project has been
  # recording for months, "a job that does not run is indistinguishable from a
  # job that passes", applied to the protection instead of to the workflow.
  #
  # Listing the eight real names would have repaired it today and broken at the
  # next matrix change, in exactly the same way. This job depends on the WHOLE
  # matrix, so its name never changes: it is the only context to require.
  #
  # `if: always()` because without it a failed `needs` SKIPS this job instead of
  # failing it - and a skipped context is not a red context, it is a context
  # that never arrives. That would be the same hole, one floor up.
  gate:
    needs: [tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: refuse unless every matrix job succeeded
        run: |
          echo "tests: ${{ needs.tests.result }}"
          test "${{ needs.tests.result }}" = "success"
